<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Игра — HlorGames</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== НАВИГАЦИЯ ===== -->
  <header class="navbar" id="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__logo">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M8 12h2m1-1v2M16 11h2M17 12h0" stroke-width="2.2"/></svg>
        <span class="logo-text">HlorGames</span>
      </a>
      <nav class="navbar__links" id="navLinks">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="index.html#games" class="nav-link">Игры</a>
        <a href="index.html#how-it-works" class="nav-link">Как играть</a>
        <span class="nav-separator">›</span>
        <a href="#" class="nav-link nav-link--game active" id="navCurrentGame">—</a>
      </nav>
      <div class="navbar__auth" id="navAuth">
        <button class="btn btn--ghost" id="btnLogin">Войти</button>
        <button class="btn btn--primary" id="btnRegister">Регистрация</button>
      </div>
      <button class="navbar__burger" id="burgerBtn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="game-main">

    <!-- ===== HERO ===== -->
    <section class="game-hero" id="gameHero">
      <div class="game-hero__inner">
        <div class="game-hero__top">
          <span class="game-hero__emoji" id="heroEmoji">🎮</span>
          <div class="game-hero__text">
            <h1 class="game-hero__title" id="heroTitle">Загрузка...</h1>
            <p class="game-hero__desc" id="heroDesc"></p>
            <div class="game-hero__meta" id="heroMeta"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== КОНТЕНТ ===== -->
    <div class="game-content">

      <!-- ЛЕВАЯ КОЛОНКА -->
      <aside class="game-sidebar">

        <!-- Табы -->
        <div class="g-tabs">
          <button class="g-tab active" id="tabCreate" onclick="switchSideTab('create')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Создать
          </button>
          <button class="g-tab" id="tabMyLobbies" onclick="switchSideTab('mylobbies')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Мои лобби
          </button>
          <button class="g-tab" id="tabRules" onclick="switchSideTab('rules')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Правила
          </button>
        </div>

        <!-- Создать лобби -->
        <div class="g-card g-tab-panel" id="panelCreate">
          <div id="createLoginNotice" class="g-notice hidden">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-dim);margin-bottom:.5rem"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <p>Войди чтобы создать лобби</p>
            <button class="btn btn--primary btn--full" onclick="openAuthModal('login')">Войти</button>
            <button class="btn btn--ghost btn--full" style="margin-top:.5rem" onclick="openAuthModal('register')">Регистрация</button>
          </div>
          <form id="createForm" class="g-form hidden" onsubmit="handleCreateLobby(event)">
            <div class="form-group">
              <label class="form-label">Название комнаты</label>
              <input type="text" class="form-input" id="lobbyName" placeholder="Весёлая мафия" maxlength="40" />
            </div>
            <div class="form-group">
              <label class="form-label">Макс. игроков</label>
              <select class="form-input" id="lobbyMaxPlayers"></select>
            </div>
            <div class="form-group">
              <label class="form-label">Пароль <span class="form-hint" style="display:inline">(необязательно)</span></label>
              <input type="text" class="form-input" id="lobbyPassword" placeholder="Без пароля — открытая" maxlength="20" />
            </div>
            <div class="form-error" id="createError"></div>
            <button type="submit" class="btn btn--primary btn--full">Создать комнату</button>
          </form>
        </div>

        <!-- Мои лобби -->
        <div class="g-card g-tab-panel hidden" id="panelMyLobbies">
          <div id="myLobbiesList"><div class="g-loading">Загрузка...</div></div>
        </div>

        <!-- Правила -->
        <div class="g-card g-tab-panel hidden g-rules-card" id="panelRules">
          <p class="g-rules-about" id="gameAbout"></p>
          <ul class="g-rules" id="gameRules"></ul>
        </div>

      </aside>

      <!-- ПРАВАЯ КОЛОНКА -->
      <div class="game-lobbies">

        <!-- Активные лобби -->
        <div class="g-section">
          <div class="g-section-header">
            <h2 class="g-section-title">
              <span class="g-online-dot"></span>
              Активные лобби
            </h2>
            <div class="g-header-actions">
              <input type="text" class="g-search-input" id="lobbySearch"
                placeholder="Поиск по названию..." oninput="filterLobbies()" />
              <button class="g-refresh-btn" onclick="loadLobbies()" title="Обновить">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
          </div>
          <div id="activeLobbies" class="g-lobby-grid">
            <div class="g-loading">Загрузка...</div>
          </div>
        </div>

        <!-- Вход по коду -->
        <div class="g-section">
          <h2 class="g-section-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Войти по коду
          </h2>
          <div class="g-join-row">
            <input type="text" class="form-input g-code-input" id="joinCodeInput"
              placeholder="XXXXX" maxlength="6"
              style="text-transform:uppercase;letter-spacing:0.2em;text-align:center;font-size:1.1rem" />
            <button class="btn btn--primary" onclick="handleJoinByCode()">Войти</button>
          </div>
          <div class="form-error" id="joinError" style="margin-top:0.5rem"></div>
        </div>

        <!-- Недавние игры -->
        <div class="g-section">
          <h2 class="g-section-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Недавние игры
          </h2>
          <div id="pastLobbies">
            <div class="g-loading">Загрузка...</div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- АВТОРИЗАЦИЯ -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="modal__close" id="modalClose">✕</button>
      <div class="modal__tabs">
        <button class="modal__tab active" id="tabLogin" onclick="switchTab('login')">Войти</button>
        <button class="modal__tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
      </div>
      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn--primary btn--full">Войти</button>
      </form>
      <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Никнейм</label>
          <input type="text" class="form-input" id="regNickname" placeholder="Крутой игрок" required minlength="2" maxlength="20" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-input" id="regPassword" placeholder="Минимум 6 символов" required minlength="6" />
        </div>
        <div class="form-error" id="registerError"></div>
        <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lobby-indicator.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

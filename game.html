<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Игра — HlorGames</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== НАВИГАЦИЯ ===== -->
  <header class="navbar" id="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">HlorGames</span>
      </a>
      <nav class="navbar__links" id="navLinks">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="index.html#games" class="nav-link">Игры</a>
      </nav>
      <div class="navbar__auth" id="navAuth">
        <button class="btn btn--ghost" id="btnLogin">Войти</button>
        <button class="btn btn--primary" id="btnRegister">Регистрация</button>
      </div>
      <button class="navbar__burger" id="burgerBtn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="game-main">

    <!-- ===== HERO ИГРЫ ===== -->
    <section class="game-hero" id="gameHero">
      <div class="game-hero__inner">
        <a href="index.html" class="game-back">← Все игры</a>
        <div class="game-hero__top">
          <span class="game-hero__emoji" id="heroEmoji">🎮</span>
          <div>
            <h1 class="game-hero__title" id="heroTitle">Загрузка...</h1>
            <p class="game-hero__desc" id="heroDesc"></p>
            <div class="game-hero__meta" id="heroMeta"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== КОНТЕНТ ===== -->
    <div class="game-content">

      <!-- ЛЕВАЯ КОЛОНКА: создание лобби -->
      <aside class="game-sidebar">

        <div class="g-card" id="createCard">
          <h2 class="g-card__title">➕ Создать лобби</h2>
          <div id="createLoginNotice" class="g-notice hidden">
            <p>Войди или зарегистрируйся чтобы создать лобби</p>
            <button class="btn btn--primary btn--full" onclick="openAuthModal('login')">Войти</button>
          </div>
          <form id="createForm" class="g-form hidden" onsubmit="handleCreateLobby(event)">
            <div class="form-group">
              <label class="form-label">Название комнаты</label>
              <input type="text" class="form-input" id="lobbyName" placeholder="Весёлая мафия" maxlength="40" />
            </div>
            <div class="form-group">
              <label class="form-label">Макс. игроков</label>
              <select class="form-input" id="lobbyMaxPlayers"></select>
            </div>
            <div class="form-group">
              <label class="form-label">Пароль (необязательно)</label>
              <input type="text" class="form-input" id="lobbyPassword" placeholder="Оставь пустым — открытая" maxlength="20" />
            </div>
            <div class="form-error" id="createError"></div>
            <button type="submit" class="btn btn--primary btn--full">Создать комнату</button>
          </form>
        </div>

        <!-- ПРАВИЛА -->
        <div class="g-card g-rules-card">
          <h2 class="g-card__title">📖 Правила</h2>
          <ul class="g-rules" id="gameRules"></ul>
        </div>

      </aside>

      <!-- ПРАВАЯ КОЛОНКА: лобби -->
      <div class="game-lobbies">

        <!-- Активные лобби -->
        <div class="g-section">
          <div class="g-section-header">
            <h2 class="g-section-title">🟢 Активные лобби</h2>
            <button class="g-refresh-btn" onclick="loadLobbies()" title="Обновить">🔄</button>
          </div>
          <div id="activeLobbies" class="g-lobby-grid">
            <div class="g-loading">Загрузка...</div>
          </div>
        </div>

        <!-- Вход по коду -->
        <div class="g-section">
          <h2 class="g-section-title">🔑 Войти по коду</h2>
          <div class="g-join-row">
            <input type="text" class="form-input g-code-input" id="joinCodeInput"
              placeholder="XXXXX" maxlength="6"
              style="text-transform:uppercase;letter-spacing:0.2em;text-align:center;font-size:1.1rem" />
            <button class="btn btn--primary" onclick="handleJoinByCode()">Войти</button>
          </div>
          <div class="form-error" id="joinError" style="margin-top:0.5rem"></div>
        </div>

        <!-- Завершённые лобби -->
        <div class="g-section">
          <h2 class="g-section-title">📋 Недавние игры</h2>
          <div id="pastLobbies">
            <div class="g-loading">Загрузка...</div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ===== МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ ===== -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="modal__close" id="modalClose">✕</button>
      <div class="modal__tabs">
        <button class="modal__tab active" id="tabLogin" onclick="switchTab('login')">Войти</button>
        <button class="modal__tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
      </div>
      <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn--primary btn--full">Войти</button>
      </form>
      <form class="auth-form hidden" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Никнейм</label>
          <input type="text" class="form-input" id="regNickname" placeholder="Крутой игрок" required minlength="2" maxlength="20" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-input" id="regPassword" placeholder="Минимум 6 символов" required minlength="6" />
        </div>
        <div class="form-error" id="registerError"></div>
        <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <!-- ТОСТ -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

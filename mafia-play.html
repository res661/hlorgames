<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мафия — HlorGames</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mafia.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="mafia-body">

  <!-- ===== ТОПБАР ===== -->
  <header class="mafia-topbar" id="mafiaTopbar">
    <div class="mafia-topbar__left">
      <a href="index.html" class="mafia-logo">
        <img src="img/logo.png" alt="" style="width:22px;height:22px;object-fit:contain;" />
        <span>HLOR GAMES</span>
      </a>
      <div class="mafia-divider"></div>
      <div class="mafia-phase" id="phaseBar">
        <span class="mafia-phase__icon" id="phaseIcon">⏳</span>
        <span class="mafia-phase__text" id="phaseText">Ожидание...</span>
      </div>
      <div class="mafia-timer" id="timerEl"></div>
    </div>

    <div class="mafia-topbar__center">
      <span class="mafia-room-name" id="roomName">Мафия</span>
    </div>

    <div class="mafia-topbar__right">
      <!-- Роль текущего игрока (только для игрока) -->
      <div class="mafia-my-role hidden" id="myRoleWrap">
        <span class="mafia-my-role__label">Твоя роль</span>
        <span class="mafia-my-role__value" id="myRoleValue">—</span>
      </div>

      <!-- Кнопки управления (только хост) -->
      <div class="mafia-host-controls hidden" id="hostTopControls">
        <button class="mafia-btn mafia-btn--ghost" id="btnAdminPanel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Панель хоста
        </button>
      </div>

      <a href="#" onclick="window.history.back()" class="mafia-btn mafia-btn--ghost">← Лобби</a>
    </div>
  </header>

  <!-- ===== СЕТКА КАМЕР ===== -->
  <main class="mafia-main">
    <div class="mafia-grid" id="mafiaGrid">
      <!-- Слоты генерируются через JS -->
    </div>
  </main>

  <!-- ===== ПАНЕЛЬ ХОСТА (правая боковая) ===== -->
  <div class="mafia-panel-overlay hidden" id="adminPanelOverlay"></div>
  <aside class="mafia-panel hidden" id="adminPanel">
    <div class="mafia-panel__header">
      <h3 class="mafia-panel__title">Панель хоста</h3>
      <button class="mafia-panel__close" id="btnClosePanel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="mafia-panel__tabs">
      <button class="mafia-panel__tab active" data-ptab="players">Игроки</button>
      <button class="mafia-panel__tab" data-ptab="phases">Фазы</button>
      <button class="mafia-panel__tab" data-ptab="settings">Настройки</button>
    </div>

    <!-- Вкладка: Игроки -->
    <div class="mafia-panel__content active" id="ptab-players">
      <p class="mafia-panel__hint">Назначьте роли и VDO-ссылки игрокам</p>
      <div id="adminPlayersList"></div>
    </div>

    <!-- Вкладка: Фазы и управление -->
    <div class="mafia-panel__content hidden" id="ptab-phases">
      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Фаза игры</div>
        <div class="mafia-phase-btns">
          <button class="mafia-phase-btn" data-phase="day">☀️ День</button>
          <button class="mafia-phase-btn" data-phase="night">🌙 Ночь</button>
          <button class="mafia-phase-btn" data-phase="vote">🗳 Голосование</button>
          <button class="mafia-phase-btn" data-phase="wait">⏳ Ожидание</button>
        </div>
      </div>

      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Таймер (секунды)</div>
        <div class="mafia-timer-row">
          <input type="number" class="mafia-input" id="timerSeconds" value="60" min="5" max="600" />
          <button class="mafia-btn mafia-btn--accent" id="btnStartTimer">Старт</button>
          <button class="mafia-btn mafia-btn--ghost" id="btnStopTimer">Стоп</button>
        </div>
      </div>

      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Быстрые действия</div>
        <div class="mafia-action-btns">
          <button class="mafia-btn mafia-btn--ghost" id="btnResetVotes">Сбросить голоса</button>
          <button class="mafia-btn mafia-btn--ghost" id="btnReviveAll">Воскресить всех</button>
          <button class="mafia-btn mafia-btn--danger" id="btnResetGame">Сбросить игру</button>
        </div>
      </div>

      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Ночное событие</div>
        <button class="mafia-btn mafia-btn--ghost" id="btnRandomEvent" style="width:100%">
          🎲 Рандомное событие
        </button>
        <p style="font-size:0.74rem;color:var(--mf-muted);margin-top:6px;">Только в фазе Ночь. Сработает утром.</p>
      </div>
    </div>

    <!-- Вкладка: Настройки -->
    <div class="mafia-panel__content hidden" id="ptab-settings">
      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Название комнаты</div>
        <input type="text" class="mafia-input" id="settingRoomName" placeholder="Мафия" />
      </div>
      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Активных слотов</div>
        <div class="mafia-timer-row">
          <input type="number" class="mafia-input" id="settingSlots" min="1" max="12" value="12" />
          <button class="mafia-btn mafia-btn--accent" id="btnApplySlots">Применить</button>
        </div>
      </div>
      <div class="mafia-ctrl-group">
        <div class="mafia-ctrl-label">Сетка</div>
        <select class="mafia-input" id="settingGrid">
          <option value="4">4 в ряд (4×3)</option>
          <option value="3">3 в ряд (3×4)</option>
          <option value="6">6 в ряд (6×2)</option>
          <option value="2">2 в ряд (2×6)</option>
        </select>
        <button class="mafia-btn mafia-btn--accent" id="btnApplyGrid" style="margin-top:8px;width:100%">Применить сетку</button>
      </div>
    </div>
  </aside>

  <!-- ===== МОДАЛ: Настройка слота (хост) ===== -->
  <div class="modal-overlay" id="slotModal">
    <div class="modal" style="max-width:480px">
      <button class="modal__close" id="btnCloseSlot">✕</button>
      <h3 class="modal__title" id="slotModalTitle">Слот #1</h3>

      <div class="form-group">
        <label class="form-label">Имя игрока</label>
        <input type="text" class="form-input" id="slotName" placeholder="Имя..." maxlength="30" />
      </div>
      <div class="form-group">
        <label class="form-label">Роль</label>
        <select class="form-input" id="slotRole">
          <option value="">— не назначена —</option>
          <option value="Мирный">👤 Мирный</option>
          <option value="Мафия">🔫 Мафия</option>
          <option value="Шериф">🔍 Шериф</option>
          <option value="Доктор">💊 Доктор</option>
          <option value="Маньяк">🔪 Маньяк</option>
          <option value="Любовница">💋 Любовница</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">VDO.Ninja ссылка</label>
        <input type="text" class="form-input" id="slotVdo" placeholder="https://vdo.ninja/?view=ID" />
        <span class="form-hint">Вставьте ссылку или просто ID стрима</span>
      </div>
      <div class="form-group">
        <label class="form-label">Статус</label>
        <select class="form-input" id="slotStatus">
          <option value="alive">Жив</option>
          <option value="dead">Мёртв</option>
          <option value="extinct">Выбыл</option>
        </select>
      </div>
      <div class="form-error" id="slotError"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn--primary" style="flex:1" id="btnSaveSlot">Сохранить</button>
        <button class="btn btn--ghost" id="btnClearSlot">Очистить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/mafia-play.js"></script>
</body>
</html>
